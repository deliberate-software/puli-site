<!doctype html>
<!-- frame.html: one Mac App Store screenshot frame (2880×1800), chosen by ?n=1…10. Rendered by render.sh.
     Eyebrow (dark teal), a one-line Plex Serif headline, the window running off the bottom close beneath it, and the
     meadow only at the window's sides, with a Puli behind the flowers (or leaping over them). Each window is cut short, so its foot shows. Copy, poses, and sides are
     Alan's (Nov 24); see the frames list below. The lessons frame fans four lesson windows like cards. The closing frame
     is About's pasture and meadow, scaled up, with About's sitting Puli (from ~/dev/puli, read only). -->
<html lang="en"><head><meta charset="utf-8"><title>Puli App Store frame</title>
<style>
@font-face { font-family: "IBM Plex Serif"; font-weight: 300; src: url("../../assets/fonts/plex/IBMPlexSerif-Light-Latin1.woff2") format("woff2"); }
@font-face { font-family: "Instrument Sans"; font-weight: 400 700; src: url("../../assets/fonts/instrument-sans-latin.woff2") format("woff2"); }
:root { --paper: #CFE1DD; --ink: #1F2023; --muted: #44514E; --eyebrow: #173F3C; --sky: #EFEEEA; }
.night { --paper: #173F3C; --ink: #FBF8F3; --muted: #C3D3CF; --eyebrow: #C3D3CF; }  /* the site's dark teal by day (Alan, Nov 24) */
* { margin: 0; box-sizing: border-box; }
html, body { width: 1440px; height: 900px; overflow: hidden; }
body { background: var(--paper); color: var(--ink); font-family: "Instrument Sans", sans-serif; position: relative; }
.copy { position: absolute; top: 60px; left: 0; right: 0; text-align: center; z-index: 4; }
.eyebrow { font-size: 17px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--eyebrow); }
h1 { font-family: "IBM Plex Serif", serif; font-weight: 300; font-size: 60px; line-height: 1.12; letter-spacing: -0.01em; margin-top: 16px; white-space: nowrap; }
.eyebrow.below { margin-top: 30px; }
.sub { font-size: 20px; font-weight: 500; color: var(--muted); margin-top: 20px; letter-spacing: 0.02em; }
.win { position: absolute; left: 50%; top: 200px; width: 1100px; height: 560px; transform: translateX(-50%); z-index: 1;
       background-size: 1100px auto; background-position: top center; border-radius: 0 0 15px 15px;
       filter: drop-shadow(0 24px 48px rgba(23, 63, 60, 0.28)) drop-shadow(0 2px 6px rgba(23, 63, 60, 0.18)); }
.night .win { filter: drop-shadow(0 24px 60px rgba(0, 0, 0, 0.55)); }
.meadow img { position: absolute; z-index: 3; }
.pose { position: absolute; z-index: 2; }
.flip { transform: scaleX(-1); }
/* Lessons: four lesson windows fanned like cards */
.card { position: absolute; width: 560px; left: 440px; top: 300px; transform-origin: 50% 170%; z-index: 1;
        filter: drop-shadow(0 18px 36px rgba(23, 63, 60, 0.30)) drop-shadow(0 2px 6px rgba(23, 63, 60, 0.18)); }
/* Closing: the whole pasture along the foot, the teal fading down into its sky */
.nine { background: linear-gradient(to bottom, var(--paper) 0, var(--paper) 120px, var(--sky) 445px); }
.icon { width: 150px; height: 150px; border-radius: 34px; display: block; margin: 0 auto 40px; box-shadow: 0 14px 34px rgba(23, 63, 60, 0.25); }
.pasture { position: absolute; left: 0; bottom: 0; width: 1440px; z-index: 1;
           -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 60px); mask-image: linear-gradient(to bottom, transparent 0, #000 60px); }
.shadow { position: absolute; z-index: 2; border-radius: 50%; background: radial-gradient(closest-side, rgba(23, 63, 60, 0.30), rgba(23, 63, 60, 0.12) 60%, rgba(23, 63, 60, 0)); }
</style></head>
<body>
<script>
const A = "../art/", S = "../../assets/images/puli/", L = S + "lessons/", P = "../../../puli/Puli/Assets.xcassets/Meadow/";
// pose: [picture, width, side, inset from the frame's edge, lift off the foot]
const frames = {
  1: { eyebrow: "Puli for Mac", h: "Herd your thoughts.", win: "shots/hero.png", pose: ["sitting", 160, "left", 100, 32] },
  2: { eyebrow: "Why Puli", h: "Thoughts are fleeting. Write them down.", win: "shots/editor.png", pose: ["pack-standing", 210, "right", 74, 18] },
  3: { eyebrow: "People", h: "Everything about someone, in one place.", win: S + "people.png", pose: ["pack-running", 240, "left", 30, 52, -3] },
  4: { eyebrow: "Projects", h: "The whole project, at a glance.", win: S + "projects.png", pose: ["pack-paw", 160, "right", 84, 30] },
  5: { eyebrow: "Promises", h: "Every task, in one place.", win: S + "promises.png", pose: ["pack-walking", 220, "left", 60, 18] },
  6: { eyebrow: "In-app purchases", h: "Teach Puli new tricks.", sub: "Today · Triage · Progress · Explore · Themes · Typography · Suggestions", lessons: true, pose: ["pack-begging", 140, "right", 110, 18, 0, 5] },
  7: { eyebrow: "Job Search", h: "Keep track of every opportunity.", win: "shots/job-search.png", pose: ["pack-herding", 190, "left", 90, 28] },
  8: { eyebrow: "Private", h: "Your notes, kept in the dark.", win: "shots/locked-dark.png", center: true, pose: ["pack-sleeping", 220, "right", 90, 14] },
  9: { eyebrow: "Accessible", h: "Made for everyone.", win: "shots/accessible.png", pose: ["pack-bow", 200, "left", 74, 18, 0, 2, true] },
 10: { eyebrow: "Made on purpose by Deliberate Software", h: "Puli: A good dog for busy people.", closing: true, eyebrowBelow: true },
};
// The seven, as Puli lists them (newest first, LessonCatalog.newestFirst): one window each.
const cards = ["today", "triage", "progress", "explore", "themes", "typography", "suggestions"]
  .map(c => ({ themes: "shots/themes-plum.png", typography: "shots/typography-book.png" })[c] || L + c + ".png");
const n = new URLSearchParams(location.search).get("n") || "1", f = frames[n];
if (f.night) document.body.classList.add("night");
if (f.closing) document.body.classList.add("nine");
let html = `<div class="copy">${f.closing ? `<img class="icon" src="${A}puli-icon-square-400.png" alt="">` : ""}
  ${f.eyebrowBelow ? "" : `<p class="eyebrow">${f.eyebrow}</p>`}<h1>${f.h}</h1>${f.eyebrowBelow ? `<p class="eyebrow below">${f.eyebrow}</p>` : ""}${f.sub ? `<p class="sub">${f.sub}</p>` : ""}</div>`;
if (f.win) html += `<div class="win" style="background-image:url('${f.win}')"></div>`;
if (f.lessons) cards.forEach((src, i) => {
  const t = i - 3, angle = t * 6, dx = t * 128, dy = Math.abs(t) * Math.abs(t) * 7;
  html += `<img class="card" src="${src}" style="transform:translate(${dx}px,${dy}px) rotate(${angle}deg);z-index:1" alt="">`;
});
const meadowPiece = (name, x, w, bottom, flip) =>
  `<img src="${A}meadow/${name}.png" class="${flip ? "flip" : ""}" style="left:${x}px;bottom:${bottom}px;width:${w}px" alt="">`;
if (f.closing) {
  // About's foot (820 wide there), scaled to the frame: its meadow, and Puli sitting where she herds there, at the
  // size she sits on the Job Search frame, with her shadow.
  const k = 1440 / 820, lift = 4 * k, w = 160, center = (145 + 48) * k, left = center - w / 2, s = w / 322;
  const file = name => name.startsWith("Grass") ? `grass-flat-${name.slice(5)}` : `poppies-flat-${name.slice(7)}`;
  const meadow = [["Grass8", -11, 81], ["Poppies4", 44, 90], ["Grass5", 146, 21], ["Grass1", 161, 19, true], ["Grass2", 176, 14],
    ["Grass5", 253, 31], ["Grass2", 294, 41], ["Poppies3", 355, 68], ["Grass1", 451, 37], ["Poppies5", 519, 77], ["Grass10", 618, 29],
    ["Poppies6", 666, 90], ["Grass8", 754, 75, true]];
  html += `<img class="pasture" src="${P}Pasture.imageset/Pasture.png" alt="">`;
  html += `<div class="shadow" style="left:${left + 40 * s}px;bottom:${lift - 4}px;width:${260 * s}px;height:16px"></div>`;
  html += `<img class="pose" src="${P}PuliSitting.imageset/PuliSitting.png" style="left:${left}px;bottom:${lift}px;width:${w}px" alt="">`;
  html += `<div class="meadow">${meadow.map(([name, x, pw, flip]) => meadowPiece(file(name), x * k, pw * k, -4, flip)).join("")}${meadowPiece("grass-flat-8", left + 70, 130, -4)}</div>`;
} else {
  // The meadow, only at the window's sides: a few tufts and poppies at each, in front of Puli.
  const side = [["grass-flat-8", -24, 120], ["poppies-flat-4", 62, 160], ["grass-flat-5", 196, 70], ["poppies-flat-3", 248, 120], ["grass-flat-2", 352, 64]];
  let m = "";
  for (const [name, x, w] of side) m += meadowPiece(name, x, w, -8);
  for (const [name, x, w] of side) m += meadowPiece(name, 1440 - x - w, w, -8, true);
  html += `<div class="meadow">${m}</div>`;
}
if (f.pose) {
  const [pose, w, side, inset, lift, turn = 0, z = 2, flip = false] = f.pose;
  html += `<img class="pose" src="${pose === "sitting" ? P + "PuliSitting.imageset/PuliSitting.png" : A + "pack/" + pose + ".png"}" style="width:${w}px;${side}:${inset}px;bottom:${lift}px;z-index:${z};transform:rotate(${turn}deg)${flip ? " scaleX(-1)" : ""}" alt="">`;
}
document.body.insertAdjacentHTML("beforeend", html);
document.fonts.ready.then(() => {
  const copy = document.querySelector(".copy"), h = document.querySelector("h1");
  if (h.scrollWidth > 1440 - 120) document.title = "TOO WIDE";   // the copy changes, not the size
  const win = document.querySelector(".win");
  if (win) {
    // From the window's foot to the frame's, as far as from the frame's top to the eyebrow.
    const top = copy.getBoundingClientRect().bottom + 48;
    win.style.top = top + "px"; win.style.height = 900 - copy.offsetTop - top + "px";
    if (f.center) {   // the whole window, scaled to the room, its own corners showing
      const h = 900 - copy.offsetTop - top, w = h * 2122 / 1404;
      Object.assign(win.style, { width: w + "px", backgroundSize: "contain", borderRadius: "0" });
    }
  }
  // The closing frame: the icon and headline centered together between the frame's top and the pasture's land.
  if (f.closing) { const land = 900 - 1440 / 1248 * 394 + 59 * 1440 / 1248; copy.style.top = (land - copy.offsetHeight) / 2 + "px"; }
});
</script>
</body></html>

# Puli for Mac — site settings
title: Puli for Mac
tagline: Made on purpose
legal_name: Deliberate Software LLC   # the LLC's exact registered name
email: puli@deliberate.software        # where "Ask us!" and the footer's Contact link send mail
description: >-
  Puli is a notes app for Mac that herds your notes to the right people
  and projects, guards your promises, and brings you context. Coming soon.
url: "https://getpuli.com"
baseurl: ""
lang: en

# Kit (kit.com) waitlist form.
# In Kit: open the form → Save & Publish → Embed → HTML tab.
# Copy the `action` URL from the <form> tag here exactly as Kit shows it.
kit:
  form_action: "https://app.kit.com/forms/10018273/subscriptions"

# Each app is one file in _apps/. Add a file to add an app.
collections:
  apps:
    output: false

markdown: kramdown

# Every page is Puli's: its menu bar, colors, and type (assets/css/puli.css).
defaults:
  - scope:
      path: ""
    values:
      body_class: is-puli

exclude:
  - signature.jpg   # the photo the signature SVG was traced from
  - README.md
  - GUIDE-AUDIT.md    # the guide checked against the app, not a page
  - BRAND.md          # who Puli is for, not a page
  - "Puli brand and messaging guide.pdf"   # the brand guide, not a page
  - tools             # scripts for making the site's images, not pages
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
